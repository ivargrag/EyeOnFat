name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eof_owner
          POSTGRES_PASSWORD: eof_owner_pw
          POSTGRES_DB: eyeonfat
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eof_owner -d eyeonfat"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://eof_app:eof_app_pw@localhost:5432/eyeonfat
      DATABASE_ADMIN_URL: postgres://eof_owner:eof_owner_pw@localhost:5432/eyeonfat
      JWT_ACCESS_SECRET: ci-access-secret-32-characters-min!!!
      JWT_REFRESH_SECRET: ci-refresh-secret-32-characters-min!!
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
      - name: Build packages
        run: pnpm --filter @eof/domain build && pnpm --filter @eof/model-gw build && pnpm --filter @eof/agents build && pnpm --filter @eof/db build && pnpm --filter @eof/api build
      - name: Typecheck everything
        run: pnpm typecheck
      - name: Migrate + seed
        run: pnpm db:migrate && pnpm db:seed
      - name: Unit + integration tests (gate matrix, T&P, API ACs)
        run: pnpm --filter @eof/domain test && pnpm --filter @eof/api test
      - name: Web production build
        run: pnpm --filter @eof/web build
      - name: E2E (Playwright, keyed to PRD ACs)
        run: |
          npx --yes playwright install --with-deps chromium
          node apps/api/dist/index.js & sleep 4
          (cd apps/web && ./node_modules/.bin/next start -p 3000 &) && sleep 4
          pnpm e2e
      - name: Dependency audit (SCA)
        run: pnpm audit --prod --audit-level high || true
